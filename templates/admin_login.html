<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Delyvo Logistics - Admin Login</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#07111f,#102a43,#0b1728);
    color:white;
}
.login-box{
    width:min(420px,92%);
    padding:35px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.12);
    border-radius:22px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
}
.logo{
    text-align:center;
    font-size:30px;
    font-weight:800;
    margin-bottom:8px;
}
.logo span{color:#39d98a}
.subtitle{
    text-align:center;
    color:#9fb0c3;
    margin-bottom:30px;
}
label{
    display:block;
    margin:16px 0 7px;
    color:#cbd7e3;
    font-size:14px;
}
input{
    width:100%;
    padding:14px;
    border-radius:11px;
    border:1px solid #36516b;
    background:#091827;
    color:white;
    outline:none;
}
input:focus{border-color:#39d98a}
button{
    width:100%;
    margin-top:24px;
    padding:14px;
    border:0;
    border-radius:11px;
    background:#39d98a;
    color:#06130c;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
}
#error{
    display:none;
    margin-top:15px;
    padding:10px;
    border-radius:9px;
    background:#5b2020;
    color:#ffb4b4;
    text-align:center;
}
.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#9fb0c3;
    text-decoration:none;
    font-size:14px;
}
</style>
</head>
<body>

<div class="login-box">
    <div class="logo">Delyvo <span>Logistics</span></div>
    <div class="subtitle">Admin Control Center</div>

    <form id="loginForm">
        <label>Username</label>
        <input id="username" type="text" autocomplete="username" required>

        <label>Password</label>
        <input id="password" type="password" autocomplete="current-password" required>

        <button type="submit">Login to Admin Portal</button>
    </form>

    <div id="error">Invalid username or password.</div>

    <a class="back" href="/">← Back to Delyvo Logistics</a>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const error = document.getElementById("error");

    try {
        const response = await fetch("/api/admin/login", {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                username:document.getElementById("username").value,
                password:document.getElementById("password").value
            })
        });

        const data = await response.json();

        if(data.success){
            window.location.href="/admin-dashboard";
        }else{
            error.style.display="block";
        }
    }catch(err){
        error.textContent="Server connection error.";
        error.style.display="block";
    }
});
</script>

</body>
</html>
